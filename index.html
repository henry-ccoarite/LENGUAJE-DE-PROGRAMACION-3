<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece - Luffy Gear 5</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button class="btn-unidad-fijo" onclick="toggleSeccion()">UNIDAD 1</button>
    <button class="btn-unidad-fijo" onclick="toggleSeccion()">UNIDAD 2</button>

    <div class="bg-waves"></div>

    <div class="scene">
        <p class="title">Monkey D. Luffy</p>

        <div class="main-layout">
            <article id="card">
                <img src="imagenes/lufy_1.jpg" alt="Fondo" class="base-img">
                <img src="imagenes/luffy_2.png" alt="Luffy" class="luffy-img">

                <div class="name-tag">
                    <span>GEAR 5</span>
                    <small>REY DE LOS PIRATAS</small>
                </div>
            </article>

            <div class="side-controls">
                <input type="file" id="file-upload" accept="image/*" onchange="previewImage(event)" style="display:none">
                <label for="file-upload" class="upload-btn">
                    <span>+</span>
                    <small>subir <br> tarea </small>
                </label>
            </div>
        </div>

        <p class="hint">Hover para vibrar • Click para impacto</p>
    </div>

    <div id="seccion-unidad" class="seccion-oculta">
        <div class="content-wrap">
            <button class="close-btn" onclick="toggleSeccion()">CERRAR ×</button>
            <h1>UNIDAD 1: EL DESPERTAR</h1>
            <p>Contenido educativo o información de la unidad aquí.</p>
        </div>
    </div>
    <div id="seccion-unidad" class="seccion-oculta">
        <div class="content-wrap">
            <button class="close-btn" onclick="toggleSeccion()">CERRAR ×</button>
            <h1>UNIDAD 2</h1>
            <p>Contenido educativo o información de la unidad aquí.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
