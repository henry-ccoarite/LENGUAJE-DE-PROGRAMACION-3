        FadingVideo ---------------- */ const FADE_MS = 500; const FADE_OUT_LEAD = 0.55; function FadingVideo({ src, className, style }) { const videoRef = useRef(null); const rafRef = useRef(null); const fadingOutRef = useRef(false); useEffect(() =>
